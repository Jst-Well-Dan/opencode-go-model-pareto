name: Daily update

on:
  schedule:
    - cron: "30 16 * * *"  # 每天 00:30 CST (16:30 UTC前一天，错开整点延迟)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    env:
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch latest data and regenerate HTML
        id: fetch
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          retry_on: error
          command: python scripts/fetch_data.py
        # 官方 Data API 需免费 Key（secrets.ARTIFICIAL_ANALYSIS_API_KEY），解析失败抛错。
        # 失败就让作业变红并发通知：2026-11-05 旧接口下线后，原先用
        # continue-on-error 吞掉错误，导致连续一周"绿色停更"没人发现。
        # 失败时后续提交步骤不会执行，工作区改动随 runner 丢弃，不污染仓库。

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/snapshots/quota-snapshots.json data/snapshots/aa-scores.json data/snapshots/lmarena-scores.json data/snapshots/aihot-scores.json data/cache/aa-modality-cache.json data/registry/icons.json data/registry/model-meta.json data/registry/aihot-alias.json index.html
            # 若 HTML 未变化（仅时间戳变）也一并提交，确保 Pages 触发部署
            git commit -m "chore(data): daily snapshot $(TZ=Asia/Shanghai date +%F)"
            git push
          else
            echo "No changes to commit."
          fi
