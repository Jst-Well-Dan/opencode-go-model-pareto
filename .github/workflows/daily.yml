name: Daily update

on:
  schedule:
    - cron: "30 16 * * *"  # 每天 00:30 CST (16:30 UTC前一天，错开整点延迟)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    env:
      ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch latest data and regenerate HTML
        id: fetch
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          retry_on: error
          command: python scripts/fetch_data.py
        # 官方 Data API 需免费 Key（secrets.ARTIFICIAL_ANALYSIS_API_KEY），解析失败抛错
        # 失败不再让作业变红：continue-on-error + 下一步丢弃半成品，作业保持成功，
        # 因此 GitHub 不会发出 Actions 失败通知邮件。失败信息仍在日志里（::warning::）。
        continue-on-error: true

      - name: Discard partial changes on fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::数据抓取失败，本次跳过更新（作业保持成功，不发送失败邮件）"
          git checkout -- . || true
          git clean -fdq data index.html || true

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/snapshots/quota-snapshots.json data/snapshots/aa-scores.json data/snapshots/lmarena-scores.json data/snapshots/aihot-scores.json data/cache/aa-modality-cache.json data/registry/icons.json data/registry/model-meta.json data/registry/aihot-alias.json index.html
            # 若 HTML 未变化（仅时间戳变）也一并提交，确保 Pages 触发部署
            git commit -m "chore(data): daily snapshot $(TZ=Asia/Shanghai date +%F)"
            git push
          else
            echo "No changes to commit."
          fi
